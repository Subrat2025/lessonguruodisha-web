# Render Blueprint for lessonguruodisha.in
# Render dashboard -> New -> Blueprint -> pick this GitHub repo. Render reads this file and creates:
#   - lessonguru-web: the website + API (Docker, Singapore, 2 GB RAM)
#   - 5 cron jobs that replace .emergent/crons.yml (times converted from IST to UTC)
#   - env group lessonguru-shared: values shared by the website and the cron jobs
# Secrets marked `sync: false` are asked for once when the Blueprint is created. Every other value
# from the old environment can be pasted in bulk afterwards: lessonguru-web -> Environment ->
# "Add from .env".
# BACKGROUND_JOBS_DISABLED=1 pauses WhatsApp campaigns/queue, Drive sync and cron jobs until the
# switch. On switch day: Env Groups -> lessonguru-shared -> delete it (or set 0).

envVarGroups:
  - name: lessonguru-shared
    envVars:
      - key: WEBHOOK_CRON_SECRET
        generateValue: true
      - key: BACKGROUND_JOBS_DISABLED
        value: "1"

services:
  - type: web
    name: lessonguru-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: standard # 2 GB RAM: Chromium PDF generation needs it
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - fromGroup: lessonguru-shared
      - key: MONGO_URL # MongoDB Atlas connection string
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET # must be the same value as before, or every teacher is logged out
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        value: https://lessonguruodisha.in
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BULKY_AUTHKEY
        sync: false
      - key: BULKY_APPKEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  # scheduled jobs (cron schedules are in UTC; IST = UTC + 5:30)
  - type: cron
    name: cron-assess-health-alert # 07:30 IST daily
    runtime: docker
    dockerfilePath: ./deploy/cron/Dockerfile
    dockerContext: ./deploy/cron
    region: singapore
    plan: starter
    schedule: "0 2 * * *"
    dockerCommand: /bin/sh /call.sh /api/assess/cron/health-alert
    envVars:
      - fromGroup: lessonguru-shared
      - key: SITE_URL
        value: https://lessonguruodisha.in

  - type: cron
    name: cron-answer-key-bundle-expiry # 01:00 IST daily
    runtime: docker
    dockerfilePath: ./deploy/cron/Dockerfile
    dockerContext: ./deploy/cron
    region: singapore
    plan: starter
    schedule: "30 19 * * *"
    dockerCommand: /bin/sh /call.sh /api/answer-key/cron/expire-bundles
    envVars:
      - fromGroup: lessonguru-shared
      - key: SITE_URL
        value: https://lessonguruodisha.in

  - type: cron
    name: cron-answer-key-sla-alert # every hour at :15 IST
    runtime: docker
    dockerfilePath: ./deploy/cron/Dockerfile
    dockerContext: ./deploy/cron
    region: singapore
    plan: starter
    schedule: "45 * * * *"
    dockerCommand: /bin/sh /call.sh /api/answer-key/cron/sla-alert
    envVars:
      - fromGroup: lessonguru-shared
      - key: SITE_URL
        value: https://lessonguruodisha.in

  - type: cron
    name: cron-store-access-repair # 01:30 IST daily
    runtime: docker
    dockerfilePath: ./deploy/cron/Dockerfile
    dockerContext: ./deploy/cron
    region: singapore
    plan: starter
    schedule: "0 20 * * *"
    dockerCommand: /bin/sh /call.sh /api/cron/store-repair
    envVars:
      - fromGroup: lessonguru-shared
      - key: SITE_URL
        value: https://lessonguruodisha.in

  - type: cron
    name: cron-tob-purge-trash # 02:00 IST daily
    runtime: docker
    dockerfilePath: ./deploy/cron/Dockerfile
    dockerContext: ./deploy/cron
    region: singapore
    plan: starter
    schedule: "30 20 * * *"
    dockerCommand: /bin/sh /call.sh /api/tob/cron/purge-trash
    envVars:
      - fromGroup: lessonguru-shared
      - key: SITE_URL
        value: https://lessonguruodisha.in
